<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Node Dashboard</title>
    <style>
        :root {
            --neon-pink: #ff2e93; /* Sharp cyber pink */
            --bg-dark: #050508;
            --panel-bg: #0f111a;
            --text-main: #c7d0d8;
            --text-muted: #5c677d;
            --grid-line: rgba(255, 46, 147, 0.05);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 600px;
            border-bottom: 2px solid var(--neon-pink);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 { margin: 0; color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 46, 147, 0.4); font-size: 2rem; }
        .status-badge { color: var(--neon-pink); border: 1px solid var(--neon-pink); padding: 5px 10px; font-weight: bold; font-size: 0.9rem;}

        .container {
            width: 100%;
            max-width: 600px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid rgba(255, 46, 147, 0.2);
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            margin-bottom: 20px;
        }

        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
        }

        h3 { color: var(--text-main); margin-top: 0; border-bottom: 1px dashed var(--text-muted); padding-bottom: 10px; font-size: 1.1rem; }

        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .highlight { color: var(--neon-pink); }
        
        input {
            width: 100%; background: #000; border: 1px solid #333; color: var(--neon-pink);
            padding: 10px; margin-bottom: 15px; font-family: inherit; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--neon-pink); }
        
        button {
            width: 100%; background: rgba(255, 46, 147, 0.1); color: var(--neon-pink); border: 1px solid var(--neon-pink);
            padding: 12px; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s;
            margin-bottom: 10px;
        }
        button:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 15px var(--neon-pink); }
        
        .btn-secondary {
            background: transparent; border: 1px dashed var(--text-muted); color: var(--text-muted);
        }
        .btn-secondary:hover { background: var(--text-muted); color: #000; box-shadow: none; border-style: solid; }

        .sys-logs { height: 120px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #333; color: var(--text-muted); font-size: 0.8rem; margin-top: 10px;}
    </style>
</head>
<body>

    <header>
        <h1>BlockCore</h1>
        <div class="status-badge">● SYNCED</div>
    </header>

    <div class="container">
        <div class="panel">
            <h3>[ NODE ARCHITECTURE ]</h3>
            <div class="data-row"><span>Consensus:</span><span class="highlight">Proof of Work (SHA-256)</span></div>
            <div class="data-row"><span>Target Difficulty:</span><span class="highlight">Level 5 (00000...)</span></div>
            <div class="data-row"><span>Tree Structure:</span><span class="highlight">Merkle Vector</span></div>
            <div class="data-row"><span>Signatures:</span><span class="highlight">ECDSA (secp256k1)</span></div>
        </div>

        <div class="panel">
            <h3>[ SUBMIT TRANSACTION ]</h3>
            <label>Recipient Address (Public Key)</label>
            <input type="text" id="recipient" placeholder="0x..." autocomplete="off">
            
            <label>Amount (Coins)</label>
            <input type="number" id="amount" placeholder="0.00" autocomplete="off">
            
            <button onclick="signAndSend()">Send!</button>
            <button class="btn-secondary" onclick="window.location.href='ledger.html'">Ledger History</button>
            
            <div class="sys-logs" id="terminal-output">
                > Core initialized.<br>
                > Listening for transactions...<br>
            </div>
        </div>
    </div>

    <script>
        window.onload = () => {
            simulateNetworkTraffic();
            simulateBlockMining();
        };

        function signAndSend() {
            const recipient = document.getElementById('recipient').value;
            const amount = document.getElementById('amount').value;
            const terminal = document.getElementById('terminal-output');

            if (!recipient || !amount) {
                terminal.innerHTML += "<br><span style='color: #ff4444'>> ERROR: Invalid inputs.</span>";
                terminal.scrollTop = terminal.scrollHeight;
                return;
            }

            terminal.innerHTML += "<br>> Generating ECDSA signature...";
            terminal.scrollTop = terminal.scrollHeight;
            
            setTimeout(() => {
                terminal.innerHTML += "<br>> Validating against Public Key...";
                terminal.scrollTop = terminal.scrollHeight;
                setTimeout(() => {
                    terminal.innerHTML += `<br>> <span style='color: var(--neon-pink)'>[SUCCESS] Tx of ${amount} added to Mempool!</span>`;
                    terminal.scrollTop = terminal.scrollHeight;
                }, 600);
            }, 500);
        }

        function simulateNetworkTraffic() {
            const messages = [
                "> Pinging peer node [::ffff:192.0.2.1]...",
                "> Validating block hash 00000a9f8c...",
                "> Dropped stale connection.",
                "> Synchronizing mempool... +3 tx added",
                "> Checking Merkle root integrity... OK"
            ];
            
            const terminal = document.getElementById('terminal-output');
            
            setInterval(() => {
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                terminal.innerHTML += `<br><span style="color: #4a5568">${randomMsg}</span>`;
                terminal.scrollTop = terminal.scrollHeight;
            }, Math.random() * 3000 + 3000); 
        }

        function simulateBlockMining() {
            const blockElement = document.getElementById('block-height');
            let currentHeight = 842109;

            setInterval(() => {
                currentHeight++;
                blockElement.innerText = currentHeight.toLocaleString();
                
                blockElement.style.color = "#ffffff";
                setTimeout(() => {
                    blockElement.style.color = "var(--neon-pink)";
                }, 500);
                
            }, Math.random() * 5000 + 10000);
        }
    </script>
</body>
</html>
